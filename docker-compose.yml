services:
  nginx:
    image: nginx:stable-alpine
    container_name: kontact-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot-etc:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot:ro
    networks:
      - kontact-network
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy

  certbot:
    image: certbot/certbot
    container_name: kontact-certbot
    restart: unless-stopped
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
      - certbot-webroot:/var/www/certbot
    entrypoint: >
      /bin/sh -c 'trap exit TERM;
      while :; do
        certbot renew --webroot -w /var/www/certbot --quiet;
        sleep 12h & wait $${!};
      done;'

  pgsql:
    image: postgres:17.2-alpine
    container_name: kontact-pgsql
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${DB_NAME:-postgres}"
      POSTGRES_USER: "${DB_USER:-postgres}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-postgres}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 2s
      retries: 20
    volumes:
      - pgsql:/var/lib/postgresql/data
    networks:
      - kontact-network

  redis:
    image: redis:8.0-alpine
    container_name: kontact-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 5
    volumes:
      - redis:/data
    networks:
      - kontact-network

  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
      target: production
      args:
        NODE_ENV: production
    container_name: kontact-backend
    hostname: backend
    restart: unless-stopped
    env_file: .env.prod
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5
    depends_on:
      pgsql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - kontact-network

  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
      target: production
      args:
        NEXT_PUBLIC_URL: ${NEXT_PUBLIC_URL}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL}
    container_name: kontact-frontend
    hostname: frontend
    restart: unless-stopped
    env_file: .env.prod
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 5
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - kontact-network

networks:
  kontact-network:
    driver: bridge

volumes:
  pgsql:
    name: kontact-web-next_pgsql
  redis:
    name: kontact-web-next_redis
  certbot-etc:
    name: kontact-web-next_certbot-etc
  certbot-var:
    name: kontact-web-next_certbot-var
  certbot-webroot:
    name: kontact-web-next_certbot-webroot
